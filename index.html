    function ConsultationSection() {

      const [captcha, setCaptcha] = useState({ num1: 4, num2: 7 });
      const [captchaInput, setCaptchaInput] = useState('');
      const [captchaError, setCaptchaError] = useState('');

      const generateCaptcha = () => {
        const n1 = Math.floor(Math.random() * 8) + 2;
        const n2 = Math.floor(Math.random() * 8) + 1;
        setCaptcha({ num1: n1, num2: n2 });
        setCaptchaInput('');
        setCaptchaError('');
      };

      useEffect(() => {
        generateCaptcha();
      }, []);

      const topics = [
        'Funding & SR&ED Grants',
        'Business Development & Growth',
        'Start-Up & Business Planning',
        'Business Challenges & Turnaround',
        'Corporate Training & Leadership Coaching',
        'General Advisory Inquiry',
      ];

      const handleChange = (e) => {
        const { name, value } = e.target;
        if (name === 'phone') {
          // Only allow numeric digits (0-9)
          const numericValue = value.replace(/\D/g, '');
          setFormData((prev) => ({ ...prev, [name]: numericValue }));
          return;
        }
        setFormData((prev) => ({ ...prev, [name]: value }));
      };

      const [submitError, setSubmitError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitError('');

        // 1. Invisible Honeypot check for bots
        if (formData.bot_field) {
          console.warn('Spam bot detected via honeypot.');
          return;

        // 2. CAPTCHA verification
        const expected = captcha.num1 + captcha.num2;

          generateCaptcha();
          setCaptchaError('Incorrect security calculation. Please calculate again.');
          return;

        setCaptchaError('');
        setIsSubmitting(true);
        try {
          const { bot_field, ...fields } = formData;
          const res = await fetch('contact.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...fields, website: bot_field }),

          const result = await res.json().catch(() => ({}));
          if (!res.ok || !result.ok) {
            throw new Error(result.error || 'We could not send your enquiry. Please email us directly at info@ipakservices.com.');
          }
          setIsSubmitted(true);
          generateCaptcha();
        } catch (err) {

          setIsSubmitting(false);

    // --- Main App Component ---
    function App() {
      const [isPrivacyOpen, setIsPrivacyOpen] = useState(false);

      useEffect(() => {
        const revealElements = () => {
          const els = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
          if (!els.length) return;

          if (!('IntersectionObserver' in window)) {
            els.forEach((el) => el.classList.add('is-visible'));
            return;
          }

          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add('is-visible');
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.05, rootMargin: '0px 0px -20px 0px' }
          );

          els.forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight) {
              el.classList.add('is-visible');
            } else {
              observer.observe(el);
            }
          });
        };

        // Run immediately when React mounts
        revealElements();

        // Check on scroll and resize
        window.addEventListener('scroll', revealElements, { passive: true });
        window.addEventListener('resize', revealElements, { passive: true });

        // Bulletproof fail-safe: Ensure ALL sections become visible within 800ms
        // even if observer or scroll events are delayed or throttled by browser
        const safetyTimer = setTimeout(() => {
          document.querySelectorAll('.reveal-on-scroll').forEach((el) => {
            el.classList.add('is-visible');
          });
        }, 800);

        return () => {
          clearTimeout(safetyTimer);
          window.removeEventListener('scroll', revealElements);
          window.removeEventListener('resize', revealElements);
        };
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-[#FAFAF9] text-slate-800 font-sans selection:bg-brand-gold selection:text-white">
          <Navbar />
          <main className="flex-grow">

            <Services />
            <WhoWeWorkWith />
            <FAQ />
            <ConsultationSection />
          </main>
          <Footer onOpenPrivacy={() => setIsPrivacyOpen(true)} />
          <PrivacyModal isOpen={isPrivacyOpen} onClose={() => setIsPrivacyOpen(false)} />
        </div>
      );
    }
